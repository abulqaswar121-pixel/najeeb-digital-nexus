name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Typecheck (server)
        run: npm run typecheck:server

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # TEMPORARY DIAGNOSTIC: this runner's job logs are stored on Azure blob
        # and cannot be fetched from the authoring sandbox, so surface failure
        # lines as check-run annotations instead (readable via the GitHub API).
        # Revert to a plain `run: npm run test` once the failure is identified.
        run: |
          set +e
          npm run test 2>&1 | tee /tmp/vitest-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "VITEST-FATAL-CONTEXT node=$(node -v) npm=$(npm -v) cwd=$PWD"
            grep -aE "FAIL |AssertionError|Error:|TypeError|ReferenceError|Cannot find|× |Unhandled|expected .* to " /tmp/vitest-output.txt \
              | head -50 \
              | while IFS= read -r line; do
                  printf '::error title=vitest::%s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
                done
          fi
          exit "$code"

      - name: Production build
        run: npm run build

  # Disabled until this pipeline is confirmed running on a runner that permits
  # installing Playwright's browser binaries (ubuntu-latest GitHub-hosted
  # runners support this out of the box; this job is kept here but not yet
  # enabled since it hasn't been validated in this environment). Flip
  # `if: false` to `if: true` once validated.
  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
