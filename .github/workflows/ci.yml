name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: jsdom 30 (pulled in by the vitest jsdom environment
          # used by the component tests) calls undici internals that Node 20's
          # bundled undici does not expose, which fails every jsdom test file
          # with "webidl.util.markAsUncloneable is not a function". Node 20 is
          # also deprecated on GitHub-hosted runners.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Typecheck (server)
        run: npm run typecheck:server

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  # Runs on ubuntu-latest, which can install Playwright's browser binaries.
  # playwright.config.ts boots both servers for us: the Express API on 8787
  # and the Vite preview (which proxies /api there) on 4173.
  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: jsdom 30 (pulled in by the vitest jsdom environment
          # used by the component tests) calls undici internals that Node 20's
          # bundled undici does not expose, which fails every jsdom test file
          # with "webidl.util.markAsUncloneable is not a function". Node 20 is
          # also deprecated on GitHub-hosted runners.
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
