name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: jsdom 30 (pulled in by the vitest jsdom environment
          # used by the component tests) calls undici internals that Node 20's
          # bundled undici does not expose, which fails every jsdom test file
          # with "webidl.util.markAsUncloneable is not a function". Node 20 is
          # also deprecated on GitHub-hosted runners.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Typecheck (server)
        run: npm run typecheck:server

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  # Runs on ubuntu-latest, which can install Playwright's browser binaries.
  # playwright.config.ts boots both servers for us: the Express API on 8787
  # and the Vite preview (which proxies /api there) on 4173.
  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: jsdom 30 (pulled in by the vitest jsdom environment
          # used by the component tests) calls undici internals that Node 20's
          # bundled undici does not expose, which fails every jsdom test file
          # with "webidl.util.markAsUncloneable is not a function". Node 20 is
          # also deprecated on GitHub-hosted runners.
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright
        id: playwright
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.txt
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # The failing assertions are published on the PR so a run can be triaged
      # from the conversation instead of digging through the log archive.
      - name: Comment failures on the pull request
        # Best-effort: the token may not carry pull-requests: write, in which
        # case the annotations below are the machine-readable record.
        continue-on-error: true
        if: always() && github.event_name == 'pull_request' && steps.playwright.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Playwright e2e failures"
            echo
            echo "\`\`\`"
            grep -aE "^[[:space:]]*([0-9]+\\)|(✘|×|✗|Error:|Expected|Received|Timed out|›))|expect\\(" e2e-output.txt | head -140
            echo "\`\`\`"
            echo
            echo "_Full report: the \`playwright-report\` artifact on this run._"
          } > /tmp/e2e-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/e2e-comment.md
      # Annotations ride on the job's check run and are readable via the
      # Checks API, unlike the raw log archive. One annotation per failure,
      # carrying the test id plus the first lines of the error.
      - name: Publish failure annotations
        if: always() && steps.playwright.outcome == 'failure'
        run: |
          awk '
            /^[[:space:]]*[0-9]+\) / {
              msg = $0; sub(/^[[:space:]]+/, "", msg); gsub(/%/, "%25", msg);
              n = 0; capturing = 1; next
            }
            capturing {
              line = $0; gsub(/\r/, "", line); gsub(/%/, "%25", line);
              msg = msg " || " line; n++;
              if (n >= 5) { print "::error::" msg; capturing = 0 }
            }
          ' e2e-output.txt | head -16

      - name: Fail the job if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
